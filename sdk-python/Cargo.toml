[package]
name = "pace-python"
version = "1.0.0"
edition = "2021"

[lib]
name = "pace_native"
crate-type = ["cdylib"]

[dependencies]
# Added abi3 and abi3-py38 to guarantee compatibility with all modern Python versions (including 3.14)
pyo3 = { version = "0.20.3", features = ["extension-module", "abi3", "abi3-py38"] }
pace-engine = { path = "../pace-engine" }